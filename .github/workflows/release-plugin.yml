# Publish ONE plugin version as a GitHub release.
#
#   git tag plugin/desktop/v1.2.0 && git push origin plugin/desktop/v1.2.0
#
# The tag format comes from pyproject.toml ([tool.pai.plugins] tag_format). The workflow refuses a tag that does not
# match an existing plugin version folder and manifest, a commit that is not on main, or versions that drifted. It
# attaches the same deterministic package the server serves (<id>-<version>-<platform>.tar.gz), SHA256SUMS, and release
# notes built from the manifest's changelog.

name: release-plugin

on:
  push:
    tags:
      - "plugin/*/v*"

permissions:
  contents: write                 # create the release

concurrency:
  group: release-plugin-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at a commit that is not on main: merge first, then tag"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-tools.txt

      - name: Install the tools (no heavy runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install -r .github/requirements-tools.txt

      - name: Versions are in sync and the manifests are valid
        run: |
          pai-sync-versions --github
          pai-check-plugin-versions --no-git --github
          pai-validate-manifests plugin_registry/plugins

      - name: Package the plugin version named by the tag
        run: pai-package-plugin "$GITHUB_REF_NAME" --out dist       # also verifies tag <-> folder <-> manifest version

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
