id: chat.reply
current: v1.1.0
description: >
  Conversational reply. Now uses spotlighted boundaries around all
  user-controlled blocks so injection attempts in memory, history, or
  tool results can't hijack the model.

variables:
  goal:                "User's message (plain text, untruncated)"
  capability_block:    "Pre-rendered live-capability list (empty → omitted)"
  memory_block:        "Relevant memories (empty → omitted)"
  history_block:       "Recent conversation turns (empty → omitted)"
  prior_results_block: "JSON of tool results (empty → chat-only turn)"
  tone:                "friendly | brief | professional"
  is_retry:            "True if retrying a previous attempt"

versions:
  v1.0.0:
    created_at: "2026-11-14"
    notes: >
      Extracted from TaskOrchestrator._chat_reply. Two behavioural fixes
      included because the previous inline prompt silently dropped them:
        (a) tone is now rendered. 'tone' has always been a declared
            capability parameter (friendly/brief/professional) but the
            old prompt never used it — every reply was 'friendly'.
        (b) is_retry now produces an explicit "this is a retry" hint so
            the LLM acknowledges the previous attempt instead of behaving
            as if it's the first ask. Previously the retry signal was only
            threaded through the memory recall (exclude_session / include_failed),
            not the prompt text itself.
      All other text (base instructions, tool-call suppression, capability
      emphasis, memory-wins-over-history rule) is byte-for-byte preserved.
      
  v1.1.0:
    created_at: "2026-11-15"
    notes: >
      Spotlighted boundaries (<<<BEGIN_X>>> / <<<END_X>>>) around user goal,
      memory, history, and tool results. Explicit content-safety preamble
      telling the model that only the preamble is trusted instruction.
      Stronger output contract at the top of the prompt (was previously
      buried fourth). Matches the request-side sanitization performed by
      pai.security.llm_guard.PromptGuard.