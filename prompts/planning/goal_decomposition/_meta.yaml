id: planning.goal_decomposition
current: v1.1.1
description: >
  Decomposes a user goal into a JSON array of executable TaskSpecs.
  Expects a pre-fetched capability list, optional memory + history
  context, and the user's timezone so relative times resolve correctly.

# Declared variables — the loader validates the template references
# only these. Catches typos in templates before they hit production.
variables:
  goal:               "User's goal as plain text (untruncated)"
  capabilities_block: "Pre-rendered capability list (markdown-ish)"
  memory_block:       "Relevant memories (empty string if none)"
  history_block:      "Recent conversation turns (empty string if none)"
  is_retry:           "True if retrying a previous attempt"
  user_tz:            "IANA timezone name, e.g. Asia/Kolkata"
  current_time:       "ISO 8601 UTC timestamp"
  chat_capability_id: "Sentinel id for conversational fallback"
  source_device:      "Originating device id (optional)"

versions:
  v1.0.0:
    created_at: "2026-11-10"
    notes: "Initial extraction from GoalDecomposer._build_prompt"
  v1.0.1:
    created_at: "2026-11-24"
    notes: "Changed type to name and now type is one of one_shot, long_running, or stream"
  v1.1.0:
    created_at: "2026-11-24"
    notes: >
      Rewrite. Removes "type" (TaskSpec.type/timeout now come from the capability manifest) and
      the trailing ADDITIONAL CONTEXT JSON dump (context_json variable removed). Adds a content
      safety preamble and spotlighted boundaries around history, memory and the goal. Adds
      rules: object/array parameters must be real JSON, independent tasks must not depend on
      each other, scheduling guidance, and AMBIGUITY - ask the user (chat.reply with
      intent=clarify, question, options) instead of guessing required/enum parameters, with a
      follow-up-turn rule. Numbering fixed; retry rule kept.
  v1.1.1:
    created_at: "2026-11-24"
    notes: >
      Relative delays use `after_seconds` (resolved by the server at execution time) instead of
      the model computing `when` from a clock that is stale after a slow planning call. Adds the
      "ASK the user if not specified" exception to the never-ask-about-defaults rule.
