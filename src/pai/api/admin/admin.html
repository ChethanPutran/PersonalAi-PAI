<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAI Admin</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --surface-3: #293548;
    --border: #475569;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --llm: #a855f7;
    --tool: #f97316;
    --span: #0ea5e9;
    --trace: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  code, pre, .mono {
    font-family: ui-monospace, Menlo, "Cascadia Code", monospace;
  }
  button { font-family: inherit; }

  /* ============ Login ============ */
  #login-overlay {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15,23,42,.95); backdrop-filter: blur(8px);
  }
  #login-overlay.hidden { display: none; }
  .login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px; width: 360px;
    box-shadow: 0 24px 48px rgba(0,0,0,.5);
  }
  .login-card h2 { margin: 0 0 8px; font-size: 20px; }
  .login-card p.sub { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
  .login-card input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; font-size: 14px;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .login-card button {
    width: 100%; padding: 10px; margin-top: 8px;
    background: var(--accent); color: var(--bg);
    border: none; border-radius: 6px;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .login-card button:disabled { opacity: .6; cursor: default; }
  #login-error {
    color: var(--err); font-size: 13px; margin-top: 12px;
    min-height: 18px; text-align: center;
  }

  /* ============ App shell ============ */
  #app { display: none; height: 100vh; }
  #app.visible { display: flex; flex-direction: column; }

  header {
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0; height: 56px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .right { display: flex; align-items: center; gap: 12px; }
  header .user-info { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  header .user-info strong { color: var(--text); font-weight: 500; }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); animation: pulse 2s infinite; flex-shrink: 0;
  }
  header .dot.offline { background: var(--err); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
  header .logout-btn {
    padding: 6px 12px; background: transparent;
    border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  header .logout-btn:hover { color: var(--text); border-color: var(--text); }

  .layout { display: flex; flex: 1; min-height: 0; }



  /* ── Header interval control ── */
header .interval-control {
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  height: 32px;
}
header .interval-control label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--muted);
}
header .interval-control select {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 8px; font-size: 12px; font-family: inherit;
  cursor: pointer;
}
header .interval-control select:focus {
  outline: none; border-color: var(--accent);
}
header .refresh-now-btn {
  background: transparent; color: var(--muted);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 8px; font-size: 13px; cursor: pointer;
  line-height: 1;
}
header .refresh-now-btn:hover { color: var(--text); background: var(--surface-2); }
header .refresh-now-btn.spinning { animation: spin 0.6s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

  /* ── Action buttons ── */
.btn-sm {
  padding: 3px 8px; font-size: 11px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); cursor: pointer;
}
.btn-sm:hover { background: var(--border); }
.btn-sm.danger { color: var(--err); border-color: rgba(239,68,68,.4); }
.btn-sm.danger:hover { background: rgba(239,68,68,.15); }
.btn-sm.ok     { color: var(--ok); border-color: rgba(34,197,94,.4); }
.btn-sm.warn   { color: var(--warn); border-color: rgba(245,158,11,.4); }
.btn-primary {
  padding: 8px 14px; background: var(--accent); color: var(--bg);
  border: none; border-radius: 6px; font-weight: 700; cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-secondary {
  padding: 8px 14px; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
}
.btn-danger {
  padding: 8px 14px; background: var(--err); color: #fff;
  border: none; border-radius: 6px; font-weight: 700; cursor: pointer;
}

.row-actions { display: flex; gap: 4px; flex-wrap: wrap; }

/* ── Section header with primary action ── */
.view-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
}
.view-toolbar h2 { margin: 0; font-size: 18px; }

/* ── Modal ── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 900;
  background: rgba(15,23,42,.75); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
}
.modal-backdrop.hidden { display: none; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; min-width: 380px;
  max-width: 640px; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 24px 48px rgba(0,0,0,.6);
}
.modal h3 { margin: 0 0 16px; font-size: 16px; }
.modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.modal input, .modal select, .modal textarea {
  width: 100%; padding: 8px 10px; margin-bottom: 12px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; font-size: 13px;
  font-family: inherit;
}
.modal input[type=checkbox] { width: auto; margin-right: 6px; }
.modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.modal-error {
  color: var(--err); font-size: 12px; margin-bottom: 8px;
  min-height: 16px;
}

/* ── Toast ── */
.toast-container {
  position: fixed; bottom: 24px; right: 24px; z-index: 1100;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--surface-2); border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  padding: 10px 16px; border-radius: 6px; font-size: 13px;
  animation: toast-in .2s ease-out;
  max-width: 360px;
}
.toast.ok    { border-left-color: var(--ok); }
.toast.err   { border-left-color: var(--err); }
.toast.warn  { border-left-color: var(--warn); }
@keyframes toast-in {
  from { transform: translateY(10px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

  /* ============ Sidebar ============ */
  .sidebar {
    width: 200px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 16px 0;
    overflow-y: auto;
  }
  .nav-item {
    display: block; padding: 10px 24px;
    color: var(--muted); text-decoration: none;
    cursor: pointer; font-size: 13px;
    border-left: 3px solid transparent;
    user-select: none;
  }
  .nav-item:hover { background: var(--surface-3); color: var(--text); }
  .nav-item.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: var(--surface-3);
  }
  .nav-item .count {
    float: right; font-size: 11px; color: var(--muted);
    background: var(--bg); padding: 1px 6px; border-radius: 999px;
  }

  /* ============ Content ============ */
  .content { flex: 1; overflow-y: auto; min-width: 0; padding: 20px 24px; }
  .view { display: none; }
  .view.active { display: block; }

  /* Overview */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .card .label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left; padding: 10px 12px;
    border-bottom: 1px solid var(--border); vertical-align: top;
  }
  th {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); font-weight: 600;
  }
  tr:hover { background: var(--surface); }
  code { font-size: 12px; color: var(--accent); }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .badge.online, .badge.completed { background: rgba(34,197,94,.15); color: var(--ok); }
  .badge.offline { background: rgba(148,163,184,.15); color: var(--muted); }
  .badge.enabled { background: rgba(56,189,248,.15); color: var(--accent); }
  .badge.disabled { background: rgba(148,163,184,.15); color: var(--muted); }
  .badge.error, .badge.failed { background: rgba(239,68,68,.15); color: var(--err); }
  .badge.admin { background: rgba(234,179,8,.15); color: var(--warn); }
  .badge.running { background: rgba(234,179,8,.15); color: var(--warn); }

  .empty { padding: 40px; text-align: center; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); }
  details[open] summary { color: var(--accent); }
  details ul { margin: 8px 0 0 16px; padding: 0; }
  details li { margin: 4px 0; color: var(--muted); font-size: 12px; }

  /* ============ Traces split view ============ */
  #view-traces.active { display: flex; }
  #view-traces {
    margin: -20px -24px;
    height: calc(100vh - 56px);
    padding: 0;
  }
  .traces-list-panel {
    width: 380px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--surface);
  }
  .traces-filters {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .traces-filters input,
  .traces-filters select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; font-size: 12px;
  }
  .traces-filters input { width: 150px; }
  .traces-filters label {
    font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 4px;
  }
  .traces-filters button {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .traces-filters button:hover { background: var(--border); }

  .trace-list { flex: 1; overflow-y: auto; }
  .trace-row {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .trace-row:hover { background: var(--surface-3); }
  .trace-row.active {
    background: var(--surface-3);
    border-left: 3px solid var(--accent);
    padding-left: 13px;
  }
  .trace-row .top {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 4px;
  }
  .trace-row .goal {
    color: var(--muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trace-row .meta {
    color: var(--muted); font-size: 11px; margin-top: 4px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .trace-row .time { color: var(--muted); font-size: 11px; }

  /* ============ Trace detail (LangSmith-style) ============ */
  .trace-detail-panel {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }

  .trace-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .trace-header h2 {
    margin: 0 0 6px; font-size: 16px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .trace-header .sub {
    color: var(--muted); font-size: 12px;
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center;
  }
  .trace-header .sub code { font-size: 11px; }

  .trace-stats {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex; gap: 20px; flex-wrap: wrap;
    flex-shrink: 0;
  }
  .stat-chip {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .stat-chip .stat-icon { font-size: 14px; }
  .stat-chip .stat-value {
    color: var(--text); font-weight: 600;
  }
  .stat-chip.stat-llm .stat-icon { color: var(--llm); }
  .stat-chip.stat-tool .stat-icon { color: var(--tool); }
  .stat-chip.stat-err .stat-icon { color: var(--err); }

  .trace-body {
    flex: 1; display: flex; min-height: 0;
    overflow: hidden;
  }

  /* Tree pane */
  .trace-tree-pane {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .tree-toolbar {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex; gap: 8px; align-items: center;
    flex-shrink: 0;
  }
  .tree-toolbar input {
    flex: 1;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; font-size: 12px;
  }
  .tree-toolbar button {
    background: var(--bg); color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .tree-toolbar button:hover { color: var(--text); background: var(--border); }

  .tree-container {
    flex: 1; overflow-y: auto;
    font-family: ui-monospace, Menlo, "Cascadia Code", monospace;
    font-size: 12px;
  }

  .tree-row {
    display: flex; align-items: center;
    padding: 4px 8px;
    cursor: pointer;
    border-left: 2px solid transparent;
    position: relative;
  }
  .tree-row:hover { background: var(--surface); }
  .tree-row.selected {
    background: var(--surface-3);
    border-left-color: var(--accent);
  }
  .tree-row.hidden { display: none; }

  .tree-row .chev {
    width: 14px; color: var(--muted); flex-shrink: 0;
    font-size: 10px; text-align: center;
    user-select: none;
  }
  .tree-row .chev.leaf { visibility: hidden; }

  .tree-row .indent {
    display: inline-block;
    border-left: 1px dashed rgba(148,163,184,.15);
    height: 18px; margin-right: 4px;
    flex-shrink: 0;
  }

  .tree-row .icon {
    width: 18px; flex-shrink: 0;
    text-align: center; font-size: 12px;
  }
  .tree-row .icon.llm  { color: var(--llm); }
  .tree-row .icon.tool { color: var(--tool); }
  .tree-row .icon.span { color: var(--span); }
  .tree-row .icon.trace { color: var(--trace); }
  .tree-row .icon.error { color: var(--err); }
  .tree-row .icon.log  { color: var(--muted); }

  .tree-row .name {
    flex-shrink: 0;
    max-width: 40%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-right: 8px;
  }
  .tree-row.error .name { color: var(--err); }

  .tree-row .status-pill {
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    background: rgba(148,163,184,.2); color: var(--muted);
    margin-right: 6px; text-transform: uppercase;
  }
  .tree-row .status-pill.error { background: rgba(239,68,68,.2); color: var(--err); }

  .tree-row .bar-track {
    flex: 1;
    height: 12px;
    background: rgba(148,163,184,.06);
    border-radius: 2px;
    position: relative;
    min-width: 60px;
    overflow: hidden;
  }
  .tree-row .bar-fill {
    position: absolute;
    top: 0; bottom: 0;
    border-radius: 2px;
  }
  .tree-row .bar-fill.kind-llm   { background: var(--llm); opacity: .65; }
  .tree-row .bar-fill.kind-tool  { background: var(--tool); opacity: .65; }
  .tree-row .bar-fill.kind-span  { background: var(--span); opacity: .55; }
  .tree-row .bar-fill.kind-trace { background: var(--trace); opacity: .75; }
  .tree-row .bar-fill.kind-error { background: var(--err); opacity: .75; }
  .tree-row .bar-fill.kind-log   { background: var(--muted); opacity: .55; }

  .tree-row .duration {
    width: 60px; flex-shrink: 0;
    text-align: right; color: var(--muted);
    font-size: 11px; margin-left: 8px;
  }

  /* Detail pane */
  .trace-detail-pane {
    width: 420px; flex-shrink: 0;
    overflow-y: auto;
    padding: 0;
    background: var(--bg);
  }
  .trace-detail-pane .placeholder {
    padding: 40px 20px; text-align: center; color: var(--muted);
  }
  .detail-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .detail-header .title {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 13px;
    word-break: break-all;
  }
  .detail-header .title .icon { font-size: 14px; }
  .detail-header .title .icon.llm   { color: var(--llm); }
  .detail-header .title .icon.tool  { color: var(--tool); }
  .detail-header .title .icon.span  { color: var(--span); }
  .detail-header .title .icon.trace { color: var(--trace); }
  .detail-header .title .icon.error { color: var(--err); }
  .detail-header .title .icon.log   { color: var(--muted); }

  .detail-header .meta {
    margin-top: 8px;
    display: grid; grid-template-columns: 80px 1fr;
    gap: 4px 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .detail-header .meta dt { color: var(--muted); }
  .detail-header .meta dd { margin: 0; color: var(--text); word-break: break-all; }

  .detail-section {
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .detail-section .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .detail-section .section-title {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: .5px; color: var(--muted);
    font-weight: 600;
  }
  .detail-section .copy-btn {
    font-size: 10px; padding: 2px 6px;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer;
  }
  .detail-section .copy-btn:hover { color: var(--text); background: var(--surface-2); }

  .detail-section pre {
    margin: 0;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 400px;
    overflow-y: auto;
  }
  .detail-section pre.prompt { background: rgba(168,85,247,.08); border-color: rgba(168,85,247,.25); }
  .detail-section pre.response { background: rgba(168,85,247,.15); border-color: rgba(168,85,247,.4); }
  .detail-section pre.error-box {
    background: rgba(239,68,68,.12);
    border-color: rgba(239,68,68,.35);
    color: #fca5a5;
  }

  .kv-grid {
    display: grid;
    grid-template-columns: minmax(80px, max-content) 1fr;
    gap: 4px 12px;
    font-size: 12px;
  }
  .kv-grid dt { color: var(--muted); }
  .kv-grid dd { margin: 0; color: var(--text); word-break: break-all; }

  .usage-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 8px;
  }
  .usage-chip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px;
  }
  .usage-chip .u-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .usage-chip .u-value { font-size: 15px; font-weight: 600; margin-top: 2px; }

  @media (max-width: 1200px) {
    .traces-list-panel { width: 280px; }
    .trace-detail-pane { width: 320px; }
    .tree-row .name { max-width: 200px; }

<script>
(() => {
  // ============================================================
  // Config
  // ============================================================
  const API_DATA          = '/api/v1/system/admin/data';
  const API_LOGIN         = '/api/v1/auth/login';
  const API_ME            = '/api/v1/auth/me';
  const API_TRACES        = '/api/v1/system/traces';
  const API_TRACES_STREAM = '/api/v1/system/traces/stream';
  const TOKEN_KEY = 'pai_admin_token';
  const EMAIL_KEY = 'pai_admin_email';
  // ── Polling interval (persisted) ──
const INTERVAL_KEY = 'pai_admin_refresh_ms';
const DEFAULT_REFRESH_MS = 5000;
let refreshMs = (() => {
  const raw = localStorage.getItem(INTERVAL_KEY);
  if (raw === null) return DEFAULT_REFRESH_MS;
  const n = parseInt(raw, 10);
  return Number.isFinite(n) && n >= 0 ? n : DEFAULT_REFRESH_MS;
})();

function fmtInterval(ms) {
  if (!ms) return 'manual';
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000) + 's';
}

  // ============================================================
  // State
  // ============================================================
  let token = localStorage.getItem(TOKEN_KEY) || '';
  let adminEmail = localStorage.getItem(EMAIL_KEY) || '';
  let pollTimer = null;
  let traceStreamStop = null;
  let selectedTraceId = null;
  let selectedNodeId = null;
  let expandedNodes = new Set();
  let currentView = 'overview';
  let currentTree = [];        // flattened tree
  let currentEvents = [];      // raw events
  let currentSummary = null;
  let treeFilter = '';

  // ============================================================
  // Helpers
  // ============================================================
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const badge = (text, cls) => `<span class="badge ${esc(cls)}">${esc(text)}</span>`;

  const humanDuration = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60), sec = s % 60;
    if (m < 60) return m + 'm ' + sec + 's';
    return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
  };

  const humanTime = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString([], {
    hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3,
  }) : '';

  const fmtDuration = (ms) => {
    if (ms == null) return '';
    if (ms < 1) return ms.toFixed(2) + 'ms';
    if (ms < 1000) return Math.round(ms) + 'ms';
    return (ms / 1000).toFixed(2) + 's';
  };

  const authHeaders = () => token ? { 'Authorization': `Bearer ${token}` } : {};

  const setLiveStatus = (ok, text) => {
    $('live-dot').classList.toggle('offline', !ok);
    $('live-text').textContent = text;
  };

  const ICONS = {
    'trace.start': '▶',
    'trace.end': '■',
    'span.start': '⚡',
    'span.end': '⚡',
    'llm': '💬',
    'tool': '🔧',
    'error': '✖',
    'log': '•',
  };

  function iconFor(kind) {
    if (kind === 'trace.start' || kind === 'trace.end') return 'trace';
    if (kind === 'llm') return 'llm';
    if (kind === 'tool') return 'tool';
    if (kind === 'error') return 'error';
    if (kind === 'log') return 'log';
    return 'span';
  }

  // ============================================================
// Toast / Modal helpers
// ============================================================
function toast(message, kind = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${kind === 'error' ? 'err' : kind}`;
  el.textContent = message;
  $('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function openModal(html) {
  $('modal-body').innerHTML = html;
  $('modal-backdrop').classList.remove('hidden');
}
function closeModal() {
  $('modal-backdrop').classList.add('hidden');
  $('modal-body').innerHTML = '';
}
$('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});

function confirmAction(message, onConfirm) {
  openModal(`
    <h3>Confirm</h3>
    <p style="color:var(--muted);font-size:13px">${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn-secondary" id="mc-cancel">Cancel</button>
      <button class="btn-danger" id="mc-confirm">Confirm</button>
    </div>`);
  $('mc-cancel').addEventListener('click', closeModal);
  $('mc-confirm').addEventListener('click', () => {
    closeModal();
    onConfirm();
  });
}

// ============================================================
// JSON API helper
// ============================================================
async function apiCall(method, url, body) {
  const opts = {
    method,
    headers: { ...authHeaders() },
    cache: 'no-store',
  };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(url, opts);
  if (r.status === 401 || r.status === 403) { doLogout(); throw new Error('Unauthorized'); }
  if (r.status === 204) return null;
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!r.ok) {
    const detail = (data && data.detail) || `HTTP ${r.status}`;
    throw new Error(detail);
  }
  return data;
}

// ============================================================
// Tasks view
// ============================================================
let taskRefreshTimer = null;

async function refreshTasks() {
  if (!token) return;
  const params = new URLSearchParams();
  const st = $('task-filter-status').value;
  const uid = $('task-filter-user').value.trim();
  if (st) params.set('status', st);
  if (uid) params.set('user_id', uid);
  params.set('limit', '200');

  try {
    const data = await apiCall('GET', `/api/v1/system/tasks?${params}`);
    renderTasks(data.tasks || []);
    $('count-tasks').textContent = data.total ?? '';
  } catch (e) {
    $('tasks-content').innerHTML =
      `<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderTasks(tasks) {
  const el = $('tasks-content');
  if (!tasks.length) {
    el.innerHTML = '<div class="empty">No tasks found.</div>';
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>ID</th><th>Capability</th><th>User</th><th>Status</th>
        <th>Device</th><th>Created</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${tasks.map(t => {
          const statusClass = t.status === 'completed' ? 'online'
                            : t.status === 'failed'    ? 'error'
                            : t.status === 'running'   ? 'running'
                            : t.status === 'paused'    ? 'warn' : 'disabled';
          const canPause   = t.status === 'running';
          const canResume  = t.status === 'paused';
          const canCancel  = ['pending','running','paused'].includes(t.status);
          return `
            <tr>
              <td><code>${esc(t.id.slice(0, 12))}</code></td>
              <td>${esc(t.capability || '—')}</td>
              <td><code style="font-size:11px">${esc(t.user_id || '—')}</code></td>
              <td>${badge(t.status || 'unknown', statusClass)}</td>
              <td><code style="font-size:11px">${esc(t.device_id || '—')}</code></td>
              <td>${esc(t.created_at || '—')}</td>
              <td>
                <div class="row-actions">
                  <button class="btn-sm" data-action="view" data-id="${esc(t.id)}">View</button>
                  ${canPause  ? `<button class="btn-sm warn"   data-action="pause"  data-id="${esc(t.id)}">Pause</button>` : ''}
                  ${canResume ? `<button class="btn-sm ok"     data-action="resume" data-id="${esc(t.id)}">Resume</button>` : ''}
                  ${canCancel ? `<button class="btn-sm danger" data-action="cancel" data-id="${esc(t.id)}">Cancel</button>` : ''}
                </div>
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  el.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => handleTaskAction(btn.dataset.action, btn.dataset.id));
  });
}

async function handleTaskAction(action, id) {
  if (action === 'view') return showTaskDetail(id);

  const verb = { pause: 'Pause', resume: 'Resume', cancel: 'Cancel' }[action];
  if (action === 'cancel') {
    return confirmAction(`Cancel task ${id.slice(0,12)}?`, async () => {
      try {
        await apiCall('POST', `/api/v1/system/tasks/${id}/cancel`);
        toast('Task cancelled', 'ok');
        refreshTasks();
      } catch (e) { toast(e.message, 'error'); }
    });
  }

  try {
    await apiCall('POST', `/api/v1/system/tasks/${id}/${action}`);
    toast(`Task ${verb.toLowerCase()}d`, 'ok');
    refreshTasks();
  } catch (e) { toast(e.message, 'error'); }
}

async function showTaskDetail(id) {
  openModal('<h3>Loading…</h3>');
  try {
    const t = await apiCall('GET', `/api/v1/system/tasks/${id}`);
    openModal(`
      <h3>Task <code style="font-size:11px">${esc(id.slice(0,16))}</code></h3>
      <dl class="kv-grid" style="margin-bottom:16px">
        <dt>Status</dt><dd>${badge(t.status || 'unknown', t.status === 'completed' ? 'online' : t.status === 'failed' ? 'error' : 'running')}</dd>
        <dt>Capability</dt><dd>${esc(t.capability || '—')}</dd>
        <dt>User</dt><dd><code>${esc(t.user_id || '—')}</code></dd>
        <dt>Device</dt><dd><code>${esc(t.device_id || '—')}</code></dd>
        <dt>Executor</dt><dd><code>${esc(t.executor_id || '—')}</code></dd>
        <dt>Created</dt><dd>${esc(t.created_at || '—')}</dd>
        <dt>Started</dt><dd>${esc(t.started_at || '—')}</dd>
        <dt>Completed</dt><dd>${esc(t.completed_at || '—')}</dd>
        ${t.error ? `<dt>Error</dt><dd style="color:var(--err)">${esc(t.error)}</dd>` : ''}
      </dl>
      ${t.parameters ? `
        <div class="section-title" style="font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Parameters</div>
        <pre style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;max-height:200px;overflow:auto">${esc(JSON.stringify(t.parameters, null, 2))}</pre>
      ` : ''}
      ${t.result ? `
        <div class="section-title" style="font-size:11px;text-transform:uppercase;color:var(--muted);margin:12px 0 6px">Result</div>
        <pre style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;max-height:240px;overflow:auto">${esc(JSON.stringify(t.result, null, 2))}</pre>
      ` : ''}
      <div class="modal-actions">
        <button class="btn-secondary" id="modal-close">Close</button>
      </div>
    `);
    $('modal-close').addEventListener('click', closeModal);
  } catch (e) {
    openModal(`<h3 style="color:var(--err)">Error</h3>
      <p>${esc(e.message)}</p>
      <div class="modal-actions"><button class="btn-secondary" id="modal-close">Close</button></div>`);
    $('modal-close').addEventListener('click', closeModal);
  }
}

$('btn-refresh-tasks').addEventListener('click', refreshTasks);

  // ============================================================
  // TREE BUILDER
  // ============================================================
  // Given the flat list of trace events, produce a linear array
  // of { node, depth } items suitable for rendering. The tree is:
  //   - one node per distinct span_id (from span.start/span.end pairs)
  //   - children of a node = spans whose parent_span_id == node.id
  //   - plus synthetic children: "LLM call" nodes from paired
  //     llm.request + llm.response, "tool call" nodes from tool.call +
  //     tool.result, and standalone error/log nodes.
  function buildFlatTree(events) {
    if (!events.length) return [];

    // Group by span_id
    const spans = new Map();
    for (const ev of events) {
      if (!spans.has(ev.span_id)) {
        spans.set(ev.span_id, { start: null, end: null, points: [] });
      }
      const entry = spans.get(ev.span_id);
      if (ev.kind === 'span.start' || ev.kind === 'trace.start') entry.start = ev;
      else if (ev.kind === 'span.end' || ev.kind === 'trace.end') entry.end = ev;
      else entry.points.push(ev);
    }

    // Build span nodes
    const nodesById = new Map();
    for (const [spanId, { start, end, points }] of spans) {
      const startTs = start?.timestamp ?? end?.timestamp ?? 0;
      const endTs = end?.timestamp ?? startTs;
      const duration_ms = end?.duration_ms ?? Math.max(0, (endTs - startTs) * 1000);

      const node = {
        id: spanId,
        name: start?.name ?? end?.name ?? 'unknown',
        kind: start?.kind ?? end?.kind ?? 'span.start',
        startTs,
        endTs,
        duration_ms,
        attributes: { ...(start?.attributes || {}), ...(end?.attributes || {}) },
        error: end?.error || start?.error || null,
        parentId: start?.parent_span_id ?? end?.parent_span_id ?? null,
        rawEvents: [start, end].filter(Boolean),
        children: [],
      };
      nodesById.set(spanId, node);
    }

    // Pair up point events inside each span into synthetic children
    for (const node of nodesById.values()) {
      const spansOfNode = spans.get(node.id);
      if (!spansOfNode) continue;
      const points = [...spansOfNode.points].sort((a, b) => a.timestamp - b.timestamp);
      const consumed = new Set();
      let synthIdx = 0;

      // Pair by (kind-pair, name): llm.request→llm.response, tool.call→tool.result
      for (let i = 0; i < points.length; i++) {
        if (consumed.has(i)) continue;
        const ev = points[i];

        if (ev.kind === 'llm.request' || ev.kind === 'tool.call') {
          const isLlm = ev.kind === 'llm.request';
          const respKind = isLlm ? 'llm.response' : 'tool.result';
          let paired = null;
          for (let j = i + 1; j < points.length; j++) {
            if (consumed.has(j)) continue;
            const ev2 = points[j];
            if (ev2.kind === respKind && ev2.name === ev.name) {
              paired = ev2;
              consumed.add(i);
              consumed.add(j);
              break;
            }
          }
          const kind = isLlm ? 'llm' : 'tool';
          const startTs = ev.timestamp;
          const endTs = paired?.timestamp ?? ev.timestamp;
          const duration_ms = paired?.duration_ms ?? Math.max(0, (endTs - startTs) * 1000);
          const attrs = isLlm
            ? { request: ev.attributes, response: paired?.attributes || {} }
            : { call: ev.attributes, result: paired?.attributes || {} };

          node.children.push({
            id: `${node.id}::${kind}::${synthIdx++}`,
            name: ev.name,
            kind,
            startTs,
            endTs,
            duration_ms,
            attributes: attrs,
            error: paired?.error || ev.error || null,
            parentId: node.id,
            rawEvents: [ev, paired].filter(Boolean),
            children: [],
            incomplete: !paired,
          });
          if (!paired) consumed.add(i);
          continue;
        }

        if (ev.kind === 'error' || ev.kind === 'log') {
          consumed.add(i);
          node.children.push({
            id: `${node.id}::${ev.kind}::${synthIdx++}`,
            name: ev.name,
            kind: ev.kind,
            startTs: ev.timestamp,
            endTs: ev.timestamp,
            duration_ms: 0,
            attributes: ev.attributes || {},
            error: ev.error || null,
            parentId: node.id,
            rawEvents: [ev],
            children: [],
          });
        }
      }

      // Sort synthetic children by start
      node.children.sort((a, b) => a.startTs - b.startTs);
    }

    // Link spans to each other via parent_span_id
    const roots = [];
    for (const node of nodesById.values()) {
      if (node.parentId && nodesById.has(node.parentId)) {
        nodesById.get(node.parentId).children.push(node);
      } else {
        roots.push(node);
      }
    }

    // Sort roots & all children by start
    const sortRec = (arr) => {
      arr.sort((a, b) => a.startTs - b.startTs);
      arr.forEach(n => sortRec(n.children));
    };
    sortRec(roots);

    // Flatten
    const out = [];
    const walk = (nodes, depth) => {
      for (const n of nodes) {
        out.push({ node: n, depth });
        walk(n.children, depth + 1);
      }
    };
    walk(roots, 0);
    return out;
  }

  function renderTraceStats(summary, events) {
    const statsEl = $('trace-stats');
    // Compute LLM/tool/error aggregates from the events directly
    let llmCount = 0, llmMs = 0;
    let toolCount = 0, toolMs = 0;
    let errorCount = 0;

    for (let i = 0; i < events.length; i++) {
      const ev = events[i];
      if (ev.kind === 'llm.response') {
        llmCount++;
        llmMs += ev.duration_ms || 0;
      } else if (ev.kind === 'tool.result') {
        toolCount++;
        toolMs += ev.duration_ms || 0;
      } else if (ev.kind === 'error') {
        errorCount++;
      }
    }

    const chips = [
      { icon: '⏱', label: 'Duration', value: fmtDuration(summary?.duration_ms), cls: '' },
      { icon: '⚡', label: 'Spans', value: events.filter(e => e.kind === 'span.start').length, cls: '' },
      { icon: '💬', label: 'LLM', value: `${llmCount}${llmMs ? ' · ' + fmtDuration(llmMs) : ''}`, cls: 'stat-llm' },
      { icon: '🔧', label: 'Tools', value: `${toolCount}${toolMs ? ' · ' + fmtDuration(toolMs) : ''}`, cls: 'stat-tool' },
    ];
    if (errorCount) {
      chips.push({ icon: '✖', label: 'Errors', value: errorCount, cls: 'stat-err' });
    }

    statsEl.innerHTML = chips.map(c => `
      <div class="stat-chip ${c.cls}">
        <span class="stat-icon">${c.icon}</span>
        <span>${esc(c.label)}:</span>
        <span class="stat-value">${esc(c.value)}</span>
      </div>
    `).join('');
    statsEl.style.display = 'flex';
  }

  // ============================================================
  // TREE RENDER
  // ============================================================
  function treeDuration() {
    if (!currentEvents.length) return 0;
    const start = Math.min(...currentEvents.map(e => e.timestamp));
    const end = Math.max(...currentEvents.map(e => e.timestamp));
    return Math.max(1, (end - start) * 1000);
  }

  function renderTree() {
    const el = $('tree-container');
    if (!currentTree.length) {
      el.innerHTML = '<div class="empty" style="padding:20px">No events</div>';
      return;
    }

    const traceStartTs = Math.min(...currentEvents.map(e => e.timestamp));
    const totalMs = treeDuration();

    // Build rows with visibility based on expandedNodes
    const visibleRows = [];
    const visibleSet = new Set();

    // A node is visible if all its ancestors are expanded
    // (Walk down the flat list; track which depths are visible)
    const stack = [];  // { id, depth }
    for (const { node, depth } of currentTree) {
      // Pop stack entries whose depth >= this depth
      while (stack.length && stack[stack.length - 1].depth >= depth) {
        stack.pop();
      }
      const parentVisible = stack.length === 0 ||
        (stack[stack.length - 1].id && expandedNodes.has(stack[stack.length - 1].id));

      // If filter is set, show nodes whose subtree contains a match
      // (simplified: just match the node's own name)
      const matchesFilter = !treeFilter ||
        node.name.toLowerCase().includes(treeFilter) ||
        node.id.toLowerCase().includes(treeFilter);

      if (parentVisible && matchesFilter) {
        visibleRows.push({ node, depth });
        visibleSet.add(node.id);
      }
      // Push this node to stack so its children can be evaluated
      stack.push({ id: node.id, depth });
    }

    if (!visibleRows.length) {
      el.innerHTML = '<div class="empty" style="padding:20px">No matches</div>';
      return;
    }

    el.innerHTML = visibleRows.map(({ node, depth }) => {
      const hasChildren = node.children.length > 0;
      const isExpanded = expandedNodes.has(node.id);
      const isSelected = selectedNodeId === node.id;
      const iconClass = iconFor(node.kind === 'span.start' ? 'span.start' : node.kind);
      const icon = ICONS[iconClass] || '•';

      // Waterfall bar
      const relStart = ((node.startTs - traceStartTs) * 1000) / totalMs;
      const relWidth = (node.duration_ms / totalMs);
      const leftPct = Math.max(0, Math.min(100, relStart * 100));
      const widthPct = Math.max(0.5, Math.min(100 - leftPct, relWidth * 100));

      const barClass = `kind-${node.kind === 'llm' ? 'llm' :
        node.kind === 'tool' ? 'tool' :
        node.kind === 'error' ? 'error' :
        node.kind === 'log' ? 'log' :
        node.kind === 'trace.start' || node.kind === 'trace.end' ? 'trace' : 'span'}`;

      const indentLines = '<div class="indent" style="width:' + (depth * 14) + 'px"></div>';

      const incompleteMark = node.incomplete
        ? '<span class="status-pill error">incomplete</span>'
        : '';

      return `
        <div class="tree-row ${isSelected ? 'selected' : ''} ${node.error ? 'error' : ''}"
             data-id="${esc(node.id)}">
          <span class="chev ${hasChildren ? '' : 'leaf'}">${hasChildren ? (isExpanded ? '▼' : '▶') : '·'}</span>
          ${indentLines}
          <span class="icon ${iconClass}">${icon}</span>
          <span class="name" title="${esc(node.name)}">${esc(node.name)}</span>
          ${incompleteMark}
          <div class="bar-track">
            <div class="bar-fill ${barClass}"
                 style="left:${leftPct}%;width:${widthPct}%"></div>
          </div>
          <span class="duration">${fmtDuration(node.duration_ms)}</span>
        </div>
      `;
    }).join('');

    // Wire up interactions
    el.querySelectorAll('.tree-row').forEach(row => {
      const nodeId = row.dataset.id;
      const node = currentTree.find(t => t.node.id === nodeId)?.node;
      if (!node) return;

      row.addEventListener('click', (e) => {
        // Chevron → toggle
        if (e.target.classList.contains('chev')) {
          if (node.children.length) {
            expandedNodes.has(nodeId) ? expandedNodes.delete(nodeId) : expandedNodes.add(nodeId);
            renderTree();
          }
          return;
        }
        // Row → select
        selectNode(nodeId);
      });
    });

    // Auto-scroll selected into view
    if (selectedNodeId) {
      const sel = el.querySelector(`.tree-row[data-id="${CSS.escape(selectedNodeId)}"]`);
      if (sel) sel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function applyTreeFilter() {
    renderTree();
  }

  // ============================================================
  // SELECT NODE → DETAIL PANE
  // ============================================================
  function selectNode(nodeId) {
    selectedNodeId = nodeId;
    renderTree();
    renderDetailPane(nodeId);
  }

  function renderDetailPane(nodeId) {
    const entry = currentTree.find(t => t.node.id === nodeId);
    if (!entry) {
      $('trace-detail-pane').innerHTML = '<div class="placeholder">Node not found</div>';
      return;
    }
    const node = entry.node;
    const iconClass = iconFor(node.kind === 'span.start' ? 'span.start' : node.kind);
    const icon = ICONS[iconClass] || '•';

    let html = `
      <div class="detail-header">
        <div class="title">
          <span class="icon ${iconClass}">${icon}</span>
          ${esc(node.name)}
        </div>
        <dl class="meta">
          <dt>Kind</dt><dd>${esc(node.kind)}</dd>
          <dt>Started</dt><dd>${humanTime(node.startTs)}</dd>
          <dt>Duration</dt><dd>${fmtDuration(node.duration_ms)}</dd>
          <dt>Node ID</dt><dd><code style="font-size:10px">${esc(node.id)}</code></dd>
          ${node.parentId ? `<dt>Parent</dt><dd><code style="font-size:10px">${esc(node.parentId)}</code></dd>` : ''}
        </dl>
      </div>
    `;

    if (node.error) {
      html += `
        <div class="detail-section">
          <div class="section-head">
            <span class="section-title" style="color:var(--err)">✖ Error</span>
            <button class="copy-btn" data-copy="${esc(node.error)}">Copy</button>
          </div>
          <pre class="error-box">${esc(node.error)}</pre>
        </div>
      `;
    }

    if (node.kind === 'llm') {
      html += renderLlmSections(node);
    } else if (node.kind === 'tool') {
      html += renderToolSections(node);
    } else {
      html += renderSpanSections(node);
    }

    $('trace-detail-pane').innerHTML = html;
    wireCopyButtons();
  }

  function renderLlmSections(node) {
    const req = node.attributes?.request || {};
    const res = node.attributes?.response || {};

    const model = req.model || res.model || '(unknown)';
    const provider = req.provider || res.provider || '(unknown)';
    const usage = res.usage || (res.extra && res.extra.usage) || null;

    let out = `
      <div class="detail-section">
        <div class="kv-grid">
          <dt>Provider</dt><dd>${esc(provider)}</dd>
          <dt>Model</dt><dd>${esc(model)}</dd>
        </div>
      </div>
    `;

    if (usage) {
      out += `
        <div class="detail-section">
          <div class="section-head">
            <span class="section-title">Token usage</span>
          </div>
          <div class="usage-grid">
            <div class="usage-chip">
              <div class="u-label">Prompt</div>
              <div class="u-value">${esc(usage.prompt_tokens ?? '—')}</div>
            </div>
            <div class="usage-chip">
              <div class="u-label">Completion</div>
              <div class="u-value">${esc(usage.completion_tokens ?? '—')}</div>
            </div>
            <div class="usage-chip">
              <div class="u-label">Total</div>
              <div class="u-value">${esc(usage.total_tokens ?? '—')}</div>
            </div>
          </div>
        </div>
      `;
    }

    const promptText = req.prompt || '';
    const responseText = res.response || '';

    if (promptText) {
      out += `
        <div class="detail-section">
          <div class="section-head">
            <span class="section-title">Prompt</span>
            <button class="copy-btn" data-copy="${esc(promptText)}">Copy</button>
          </div>
          <pre class="prompt">${esc(promptText)}</pre>
        </div>
      `;
    }

    if (responseText) {
      out += `
        <div class="detail-section">
          <div class="section-head">
            <span class="section-title">Response</span>
            <button class="copy-btn" data-copy="${esc(responseText)}">Copy</button>
          </div>
          <pre class="response">${esc(responseText)}</pre>
        </div>
      `;
    }

    // Anything else (finish_reason, extra) — dump remaining keys
    const other = {};
    for (const [k, v] of Object.entries(req)) {
      if (k !== 'prompt' && k !== 'provider' && k !== 'model') other['req.' + k] = v;
    }
    for (const [k, v] of Object.entries(res)) {
      if (k !== 'response' && k !== 'provider' && k !== 'model' && k !== 'usage') {
        other['res.' + k] = v;
      }
    }
    if (Object.keys(other).length) {
      out += `
        <div class="detail-section">
          <div class="section-head">
            <span class="section-title">Other attributes</span>
            <button class="copy-btn" data-copy='${esc(JSON.stringify(other, null, 2))}'>Copy</button>
          </div>
          <pre>${esc(JSON.stringify(other, null, 2))}</pre>
        </div>
      `;
    }

    return out;
  }

  function renderToolSections(node) {
    const call = node.attributes?.call || {};
    const result = node.attributes?.result || {};

    const capability = call.capability || result.capability || '(unknown)';
    const plugin = call.plugin || result.plugin || '(unknown)';
    const deviceId = call.device_id || result.device_id || '(unknown)';

    let out = `
      <div class="detail-section">
        <div class="kv-grid">
          <dt>Capability</dt><dd>${esc(capability)}</dd>
          <dt>Plugin</dt><dd>${esc(plugin)}</dd>
          <dt>Device</dt><dd><code style="font-size:10px">${esc(deviceId)}</code></dd>
        </div>
      </div>
    `;

    const params = call.parameters || {};
    if (Object.keys(params).length) {
      out += `
        <div class="detail-section">
          <div class="section-head">
            <span class="section-title">Parameters (input)</span>
            <button class="copy-btn" data-copy='${esc(JSON.stringify(params, null, 2))}'>Copy</button>
          </div>
          <pre>${esc(JSON.stringify(params, null, 2))}</pre>
        </div>
      `;
    }

    const res = result.result || {};
    if (Object.keys(res).length) {
      out += `
        <div class="detail-section">
          <div class="section-head">
            <span class="section-title">Result (output)</span>
            <button class="copy-btn" data-copy='${esc(JSON.stringify(res, null, 2))}'>Copy</button>
          </div>
          <pre>${esc(JSON.stringify(res, null, 2))}</pre>
        </div>
      `;
    }

    return out;
  }

  function renderSpanSections(node) {
    const attrs = node.attributes || {};
    if (!Object.keys(attrs).length) {
      return '<div class="detail-section"><div class="placeholder" style="padding:16px">No attributes</div></div>';
    }
    return `
      <div class="detail-section">
        <div class="section-head">
          <span class="section-title">Attributes</span>
          <button class="copy-btn" data-copy='${esc(JSON.stringify(attrs, null, 2))}'>Copy</button>
        </div>
        <pre>${esc(JSON.stringify(attrs, null, 2))}</pre>
      </div>
    `;
  }

  function wireCopyButtons() {
    $('trace-detail-pane').querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const text = btn.dataset.copy || '';
        try {
          await navigator.clipboard.writeText(text);
          const orig = btn.textContent;
          btn.textContent = 'Copied';
          setTimeout(() => { btn.textContent = orig; }, 1200);
        } catch {
          btn.textContent = 'Failed';
          setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
        }
      });
    });
  }

  // ============================================================
  // LIVE STREAM
  // ============================================================
  function ensureTraceStream() {
    if (traceStreamStop) return;
    let stopped = false;
    traceStreamStop = () => { stopped = true; };

    (async () => {
      try {
        const r = await fetch(API_TRACES_STREAM, { headers: authHeaders() });
        if (r.status === 401 || r.status === 403) { doLogout(); return; }
        if (!r.ok) return;

        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (!stopped) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split('\n\n');
          buf = parts.pop();
          for (const chunk of parts) {
            const line = chunk.split('\n').find(l => l.startsWith('data: '));
            if (!line) continue;
            try {
              const ev = JSON.parse(line.slice(6));
              // Refresh trace list on every event
              loadTraces();
              // If the selected trace received a new event, refresh its content
              if (selectedTraceId && ev.trace_id === selectedTraceId) {
                // Small debounce so a burst of events doesn't thrash the DOM
                scheduleTraceRefresh(selectedTraceId);
              }
            } catch {}
          }
        }
      } catch {}
    })();
  }

  function stopTraceStream() {
    if (traceStreamStop) { traceStreamStop(); traceStreamStop = null; }
  }

  // Debounced refresh of the currently selected trace
  let refreshTimer = null;
  function scheduleTraceRefresh(traceId) {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(async () => {
      // Preserve user's expanded/selected state across refresh
      const prevExpanded = new Set(expandedNodes);
      const prevSelected = selectedNodeId;
      try {
        const r = await fetch(`${API_TRACES}/${traceId}`, { headers: authHeaders() });
        if (!r.ok) return;
        const data = await r.json();
        currentSummary = data.summary;
        currentEvents = data.events || [];
        currentTree = buildFlatTree(currentEvents);
        // Restore expanded state (new nodes default to collapsed)
        expandedNodes = prevExpanded;
        renderTraceHeader(currentSummary);
        renderTraceStats(currentSummary, currentEvents);
        renderTree();
        if (prevSelected) {
          renderDetailPane(prevSelected);
        }
      } catch {}
    }, 300);
  }

  // ============================================================
// Polling interval UI
// ============================================================
$('refresh-interval').value = String(refreshMs);

$('refresh-interval').addEventListener('change', (e) => {
  const ms = parseInt(e.target.value, 10) || 0;
  refreshMs = ms;
  localStorage.setItem(INTERVAL_KEY, String(ms));
  if (token) startPolling();
  toast(
    ms ? `Polling every ${fmtInterval(ms)}` : 'Polling disabled — use ⟳ to refresh',
    'ok',
  );
});

$('btn-refresh-now').addEventListener('click', () => {
  const btn = $('btn-refresh-now');
  btn.classList.remove('spinning');
  void btn.offsetWidth;   // reflow so the animation restarts
  btn.classList.add('spinning');
  refreshAdmin();
  if (currentView === 'tasks') refreshTasks();
});

  // ============================================================
  // Boot
  // ============================================================
  boot();
})();
</script>
</body>
</html>
