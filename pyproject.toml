[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_personal_agent"
version = "0.1.0"
description = "Personal AI agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles==23.2.1",
    "aiohttp==3.9.5",
    "aiosqlite==0.20.0",
    "chromadb==0.5.5",
    "face-recognition==1.3.0",
    "fastapi==0.110.3",
    "fastmcp==0.4.1",
    "google-generativeai>=0.3.0",
    "google-api-python-client==2.137.0",
    "google-auth==2.32.0",
    "google-auth-oauthlib==1.2.1",
    "langchain-community",
    "langchain-core",
    "langchain-nvidia-ai-endpoints",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "loguru==0.7.2",
    "mcp",
    "nats-py==2.8.0",
    "neo4j==5.22.0",
    "numpy",
    "openai>=1.0.0",
    "openpyxl==3.1.5",
    "opencv-python==4.10.0.84",
    "phue==1.1",
    "Pillow==10.2.0",
    "playwright==1.45.1",
    "posthog==2.4.2",
    "polars==1.2.1",
    "prometheus-client==0.20.0",
    "precise-runner>=0.3.0",
    "pyaudio==0.2.14",
    "pydantic>=2.0.0",
    "PyPDF2==3.0.1",
    "pyperclip==1.9.0",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "python-magic==0.4.27",
    "PyYAML==6.0.1",
    "redis==5.0.7",
    "requests==2.31.0",
    "sentence-transformers==3.0.1",
    "SQLAlchemy==2.0.31",
    "torch==2.4.1",
    "transformers==4.43.2",
    "twilio==9.2.3",
    "uvicorn==0.27.1",
    "webrtcvad==2.0.10",
    "zeroconf==0.132.2",
    "httpx>=0.27.0",
    "passlib>=1.7.4",
]
[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "httpx==0.27.0",
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
