[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_personal_agent"
version = "1.0.0"
description = "Personal AI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb==0.5.5",
    "fastapi==0.110.3",
    "google-genai>=1.2.0",
    "loguru>=0.7.3",
    "nats-py==2.8.0",
    "neo4j==5.22.0",
    "numpy>=1.26.4",
    "openai>=3.49.0",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy==2.0.31",
    "uvicorn==0.27.1",
    "croniter==7.0.0",
    "firebase-admin==6.5.0",
    "argcomplete>=3.7.2",
    "httpx>=0.27.0",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.15.0",
    "packaging>=24.0",            # version parsing (pai.version, plugin versioning)
]
[project.optional-dependencies]
# Free, offline voice (no API key): Vosk speech-to-text + Piper text-to-speech.
voice-local = [
    "vosk>=0.3.45",
    "piper-tts>=1.3",
]
dev = [
    "black==24.4.2",
    "httpx==0.27.0",
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
]

# ───────────────────────────────────────────────────────────────────────────────
# VERSION CONTROL — the single source of truth. Edit here, then run
#     pai-sync-versions --write
# to update every copy (pai/version.py, [project].version above, the manifest JSON schema,
# frontend/pubspec.yaml, frontend/lib/core/app_version.dart). CI (.github/workflows/versions.yml)
# fails if any copy drifts. Three independent axes:
#   runtime   the backend / plugin runtime. A manifest's runtime.minPaiVersion is compared with it.
#   manifest  the manifest `schemaVersion` range the server parses.
#   app       the Flutter client. A manifest's runtime.minAppVersion is compared with the device's app.
# ───────────────────────────────────────────────────────────────────────────────
[tool.pai.versions]
runtime = "1.0.0"
manifest_schema_min = 1
manifest_schema_max = 2
min_supported_app = "1.0.0"      # older apps are told to upgrade
app = "1.0.0"                    # frontend/pubspec.yaml carries `+build` after it

# Plugin release rules, enforced by `pai-check-plugin-versions` (CI: versions.yml) and the
# release workflow (.github/workflows/release-plugin.yml).
[tool.pai.plugins]
registry = "plugin_registry/plugins"           # <registry>/<id>/<X.Y.Z>/<platform>/manifest.json
manifest_name = "manifest.json"
tag_format = "plugin/{id}/v{version}"          # git tag that publishes a plugin version
immutable_released_versions = true             # a version that exists on base_ref never changes: bump instead
require_changelog_on_update = true             # a new version of an existing plugin needs changelog.summary
base_ref = "origin/main"                       # what "released" means

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pai = "pai.main:main"
bump-plugin = "scripts.bump_plugin:main"
pai-server = "pai.server._entry:main"
pai-validate-manifests = "pai.plugins.manifest_install:main"
pai-sync-versions = "pai.plugins.versioning:sync_main"
pai-check-plugin-versions = "pai.plugins.versioning:check_main"
pai-package-plugin = "pai.plugins.release:main"
pai-validate-config = "pai.config.strict:main"
[tool.uv.workspace]
members = [
    "server",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: full kernel, slow, needs DB + network"]
addopts = "-m 'not integration'"        # skip integration by default

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
]
