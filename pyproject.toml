[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_personal_agent"
version = "0.1.0"
description = "Personal AI agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb==0.5.5",
    "fastapi==0.110.3",
    "google-genai>=1.2.0",
    "loguru>=0.7.3",
    "nats-py==2.8.0",
    "neo4j==5.22.0",
    "numpy>=1.26.4",
    "openai>=3.49.0",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy==2.0.31",
    "uvicorn==0.27.1",
    "croniter==2.0.5",
    "firebase-admin==6.5.0"
]
[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "httpx==0.27.0",
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bump-plugin = "scripts.bump_plugin:main"

[tool.uv.workspace]
members = [
    "server",
]
