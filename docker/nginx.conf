server {
    listen 443 ssl;
    server_name pai.example.com;
    
    ssl_certificate /etc/letsencrypt/live/pai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pai.example.com/privkey.pem;
    
    location / {
        proxy_pass http://pai-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}