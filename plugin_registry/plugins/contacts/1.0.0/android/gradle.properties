# Required — every AndroidX dependency refuses to resolve without this.
android.useAndroidX=true
android.enableJetifier=true

# Silence the "compileSdk 35 not tested" warning — safe with AGP 8.6+.
# (With AGP 8.6+, this flag is unnecessary; keep it for AGP 8.3-8.5.)
# android.suppressUnsupportedCompileSdk=35

# ---- Build speed ----
# Reuse previous configuration phase output — saves the 85s config cost
# on rebuilds where build.gradle.kts is unchanged.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

org.gradle.parallel=true

kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

# AGP is memory-hungry; default 512 MB is way too low.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC