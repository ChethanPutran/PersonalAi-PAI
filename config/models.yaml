# Model registry for the PAI system
embeddings:
  - name: "all-MiniLM-L6-v2"
    context_length: 33K
    max_output_length: 33K
    input_per_million: 0.0
    output_per_million: 0.0
    cache_read_per_million: 0.0
    cache_write_per_million: 0.0

  - name: "alibaba/qwen3-embedding-0.6b"
    context_length: 33K
    max_output_length: 33K
    input_per_million: 0.01
    output_per_million: 0.0
    cache_read_per_million: 0.0
    cache_write_per_million: 0.0

  - name: "alibaba/qwen3-embedding-8b"
    context_length: 33K
    max_output_length: 33K
    input_per_million: 0.01
    output_per_million: 0.0
    cache_read_per_million: 0.0
    cache_write_per_million: 0.0

decision:
  # Decision models
  - name: "typesafe-ai/jev-1.14.0"
    provider: "airouter"
    context_length: 32K
    max_output_length: 32K
    input_per_million: 0.04
    output_per_million: 0.0
    cache_read_per_million: 0.0
    cache_write_per_million: 0.0

speech:
  # Speech models
  stt:
    - name: "whisper-base"
      provider: "openai"

    - name: "openai/gpt-transcribe"
      provider: "openai"
      per_minute_cost: 0.0045
      per_hour_cost: 0.27

    - name: "mistral/voxtral-mini-transcribe-3"
      provider: "mistral"
      per_minute_cost: 0.0035
      per_hour_cost: 0.21

    - name: "openai/whisper-1"
      provider: "openai"
      per_minute_cost: 0.0060
      per_hour_cost: 0.36


    - name: "microsoft/mai-transcribe-2"
      provider: "microsoft"
      per_minute_cost: 0.0017
      per_hour_cost: 0.1


  # TTS is billed per INPUT CHARACTER (per_1k_chars_cost / per_1m_chars_cost); STT per second of audio (per_minute_cost)
  tts:
    - name: "fish-audio/drama-3"
      provider: "fish-audio"
      per_1k_chars_cost: 0.01
      per_1m_chars_cost: 10

    - name: "openai/tts-1"
      provider: "openai"
      per_1k_chars_cost: 0.015
      per_1m_chars_cost: 15

    - name: "coqui" 
      provider: "local" 

# LLM models
llm:
