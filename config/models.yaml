# Vision models
vision:
  object_detection:
    default: "yolov8n.pt"
    high_accuracy: "yolov8x.pt"
  segmentation:
    default: "sam2_hiera_large"
  ocr:
    default: "paddleocr"
    language: "en"
  pose_estimation:
    default: "mediapipe"
    advanced: "openpose"

# Learning / personalization
learning:
  user_embedding_dim: 128
  sequence_model: "lstm"