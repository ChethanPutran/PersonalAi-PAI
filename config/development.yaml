# Development Configuration
environment: development
debug: true

app:
  name: "Personal AI System"
  description: "Context-Aware Autonomous Personal Agent System for Personal Productivity and Assistance"
  version: "1.0.0"

# API Server
api:
  prefix: "/api/v1"
  cors:
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]
    allow_credentials: true
  host: "0.0.0.0"
  port: 8000

server:
  reload: true
  workers: 1

orchestration:
    goal_tokens_trace_size: 300
    memory_recall_limit: 10
    memory_block_max_size: 1000
    tool_summary_block_max_size: 800
    prompt_trace_max_size: 800
    chat_reply_max_tokens: 500
    chat_reply_temperature: .7


# Database
database:
  url: "sqlite+aiosqlite:///./data/pai.db"
  echo: true
  pool_size: 5

# Redis Cache & Pub/Sub
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: null
  decode_responses: true

event_bus:
  nats_enabled: false
  nats:
    url: "nats://localhost:4222"
    servers:
      - "nats://localhost:4222"
  max_queue_size: 1000
  num_workers: 1

context:
  max_history: 5

# Memory System
memory:
  vector_db_path: "./data/chroma"
  embedding_model: "all-MiniLM-L6-v2"
  short_term_ttl: 3600  # seconds
  long_term_db_path: "./data/long_term.db"
  episodic_db_path: "./data/episodic.db"

# LLM Configuration
llm:
  provider: "openai"  # openai, local, or ollama
  model: "gpt-4"
  api_key: "${OPENAI_API_KEY}"
  base_url: null
  local_model_path: null
  max_tokens: 2000
  temperature: 0.7

# Vision Models
vision:
  object_detection_model: "yolov8n.pt"
  ocr_lang: "en"
  pose_estimation: "mediapipe"

# Automation
automation:
  browser:
    headless: false
    slow_mo: 100  # ms
  android:
    adb_path: "adb"
    device_id: null

# Logging
logging:
  level: "DEBUG"
  format: "json"
  file: "./logs/pai.log"
  max_size_mb: 100
  backup_count: 5

# Security
security:
  jwt_secret: "${JWT_SECRET:-dev_secret}"
  token_expiry_hours: 24
  rate_limit: 100  # requests per minute
  allowed_origins: ["*"]